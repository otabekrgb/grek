<!DOCTYPE html>
<html lang="ru" data-theme="marble">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматы против grek</title>
<style>
:root {
  --paper: #f4f1ea;
  --paper-2: #ebe7dc;
  --ink: #191816;
  --ink-2: #403d37;
  --muted: #7d7669;
  --line: #d8d2c3;
  --line-2: #b3ab9a;
  --light: #e9e9e7;
  --dark: #767b82;
  --hl: rgba(25, 24, 22, .10);
  --hl-sel: rgba(25, 24, 22, .20);
  --hint: rgba(25, 24, 22, .16);
  --pad-l: 26px; --pad-r: 12px; --pad-t: 12px; --pad-b: 26px;
  --panel-w: 340px;
  --bs: min(calc(100vw - var(--panel-w) - 180px), 540px);
}
html[data-theme="marble"]  { --light: #e9e9e7; --dark: #767b82; }
html[data-theme="wood"]    { --light: #e7d7b4; --dark: #9a6c47; }
html[data-theme="night"]   { --light: #bac5db; --dark: #485877; }
html[data-theme="emerald"] { --light: #e6e1cb; --dark: #57856e; }
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 15px/1.5 "Segoe UI", system-ui, Roboto, sans-serif;
  background:
    radial-gradient(1100px 520px at 50% -8%, #fbf9f4, transparent 70%),
    var(--paper);
  -webkit-font-smoothing: antialiased;
}

/* ---------- шапка-журнал ---------- */
.mast { position: relative; background: #151413 url("/img/bg.jpg") 62% 35% / cover no-repeat; }
.mast::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(12, 11, 10, .18) 0%, rgba(12, 11, 10, .74) 100%);
}
.mast-inner {
  position: relative; z-index: 1;
  max-width: 1240px;
  margin: 0 auto;
  padding: 46px 32px 26px;
  color: #f5f2ea;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
}
.kicker {
  font-size: 10.5px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: rgba(245, 242, 234, .72);
  margin-bottom: 14px;
}
.headline {
  margin: 0;
  font: 500 clamp(34px, 5vw, 62px)/1.02 Georgia, "Times New Roman", serif;
  letter-spacing: .4px;
}
.lede { margin: 12px 0 0; font-size: 14.5px; color: rgba(245, 242, 234, .76); max-width: 560px; }
.mast-meta {
  text-align: right;
  font: 11.5px/1.8 ui-monospace, Consolas, monospace;
  color: rgba(245, 242, 234, .68);
  white-space: nowrap;
  padding-bottom: 4px;
}
.mast-meta b { display: block; font-weight: 500; color: rgba(245, 242, 234, .9); }

.app {
  display: flex;
  flex-wrap: wrap;
  gap: 52px;
  justify-content: center;
  align-items: flex-start;
  padding: 34px 32px 72px;
  max-width: 1240px;
  margin: 0 auto;
}
.stage { display: flex; align-items: flex-start; }
.boardcol { width: calc(var(--bs) + var(--pad-l) + var(--pad-r)); flex: none; }

/* ---------- игроки ---------- */
.pcard { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 2px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden;
  display: grid; place-items: center;
  background: #fbf9f4;
  box-shadow: inset 0 0 0 1px var(--line-2), 0 2px 6px rgba(35, 30, 20, .12);
}
.avatar svg { width: 30px; height: 30px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.pinfo { flex: 1; min-width: 0; }
.pname { font-weight: 650; display: flex; gap: 8px; align-items: baseline; letter-spacing: .1px; }
.think { color: var(--muted); font-weight: 500; font-size: 12px; font-style: italic; }
.caps { display: flex; align-items: center; min-height: 18px; font-size: 12px; color: var(--muted); }
.caps svg { width: 18px; height: 18px; margin-right: -8px; }
.caps .pb { --stroke: var(--muted); }
.caps .grp { display: inline-flex; margin-right: 12px; }
.caps b { margin-left: 4px; color: var(--ink); font-weight: 600; }
.clock {
  font: 600 19px/1 ui-monospace, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  padding: 7px 2px;
  min-width: 88px;
  text-align: right;
  transition: color .2s, opacity .2s;
}
.clock.active { color: var(--ink); }
.clock.low { color: #8e2f1f; }
.clock.active.low { color: #6f2013; }
.clock.hidden { visibility: hidden; }

/* ---------- доска ---------- */
#frame {
  position: relative;
  padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  border-radius: 3px;
  background: #fbf9f4;
  border: 1px solid var(--line);
  box-shadow: 0 18px 44px rgba(45, 38, 24, .13), 0 2px 0 rgba(255, 255, 255, .8) inset;
}
#boardwrap { position: relative; width: var(--bs); height: var(--bs); }
#board {
  position: absolute; inset: 0;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border-radius: 2px;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  box-shadow: 0 0 0 1px rgba(25, 24, 22, .35);
}
.ranks, .files {
  position: absolute;
  display: flex;
  color: var(--muted);
  font: 600 10.5px/1 ui-monospace, Consolas, monospace;
  letter-spacing: .04em;
  pointer-events: none;
}
.ranks { left: 0; top: var(--pad-t); width: var(--pad-l); height: var(--bs); flex-direction: column; }
.ranks span { flex: 1; display: grid; place-items: center; }
.files { left: var(--pad-l); bottom: 0; width: var(--bs); height: var(--pad-b); }
.files span { flex: 1; display: grid; place-items: center; }

.sq { position: relative; }
.sq.l { background: var(--light); }
.sq.d { background: var(--dark); }
.sq .piece { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .28)); }
.sq.mine .piece { cursor: grab; }
.sq.last::before, .sq.sel::before, .sq.hint::before { content: ""; position: absolute; inset: 0; z-index: 1; }
.sq.last::before { background: var(--hl); }
.sq.sel::before { background: var(--hl-sel); box-shadow: inset 0 0 0 2px rgba(25, 24, 22, .55); }
.sq.hint::before { background: var(--hint); }
.sq.chk::after {
  content: ""; position: absolute; inset: 0; z-index: 2;
  background: radial-gradient(circle, rgba(25, 24, 22, .56) 0%, rgba(25, 24, 22, .26) 42%, rgba(25, 24, 22, 0) 74%);
  box-shadow: inset 0 0 0 2px rgba(25, 24, 22, .65);
}
.mdot { position: absolute; left: 50%; top: 50%; width: 28%; height: 28%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(25, 24, 22, .26); z-index: 4; pointer-events: none; }
.sq.cap .mdot { width: 100%; height: 100%; border-radius: 0; background: radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(25, 24, 22, .30) 62%); }
.piece.dragsrc { opacity: .22; }
.ghost { position: fixed; z-index: 1000; pointer-events: none; }
.ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .35)); }
#arrows { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }

.evalbar {
  position: absolute;
  left: -34px;
  top: var(--pad-t);
  width: 20px;
  height: var(--bs);
  background: var(--paper-2);
  border-radius: 1px;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line);
}
.evalw { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--ink); transition: height .5s ease; }
.evalbar.flip .evalw { bottom: auto; top: 0; }
.evallabel { position: absolute; left: 0; right: 0; text-align: center; font: 800 8px/1 ui-monospace, Consolas, monospace; padding: 4px 0; z-index: 2; letter-spacing: -.04em; }
.evallabel.atbottom { bottom: 0; color: #f7f4ed; }
.evallabel.attop { top: 0; color: var(--ink); }

/* ---------- фигуры ---------- */
.pw { --fill: #ffffff; --stroke: #000000; --detail: #000000; }
.pb { --fill: #1c1c1c; --stroke: #000000; --detail: #ececec; }
.m { fill: var(--fill); stroke: var(--stroke); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.m.bt { stroke-linecap: butt; }
.m.mt { stroke-linejoin: miter; }
.dt { fill: none; stroke: var(--detail); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.dt.mt { stroke-linejoin: miter; }
.ln { fill: none; stroke: var(--stroke); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: miter; }
.df { fill: var(--detail); stroke: var(--detail); stroke-width: 1.5; }
.df.ns { stroke: none; }
.pw .bonly { display: none; }

/* ---------- модалки на доске ---------- */
.modal {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(25, 24, 22, .38);
  backdrop-filter: blur(3px);
  border-radius: 2px;
}
.modal[hidden] { display: none; }
.promo {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-radius: 3px;
  background: var(--paper);
  border: 1px solid var(--ink);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
}
.promo button {
  width: calc(var(--bs) / 8 * 1.12);
  height: calc(var(--bs) / 8 * 1.12);
  padding: 0;
  border-radius: 2px;
  background: var(--light);
  border: 2px solid transparent;
  cursor: pointer;
}
.promo button:hover { border-color: var(--ink); }
.promo svg { width: 100%; height: 100%; }
.result {
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: 3px;
  padding: 28px 32px;
  text-align: center;
  min-width: 300px;
  box-shadow: 0 26px 70px rgba(0, 0, 0, .35);
}
.result h2 { margin: 0 0 6px; font: 600 32px/1.15 Georgia, "Times New Roman", serif; color: var(--ink); }
.result p { margin: 0 0 20px; color: var(--ink-2); }
.result .row { display: flex; gap: 10px; }
.result .row > * { flex: 1; white-space: nowrap; }

/* ---------- панель ---------- */
.panel {
  width: var(--panel-w);
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.brand {
  position: relative;
  display: flex; align-items: flex-end; gap: 12px;
  height: 150px;
  padding: 14px;
  border-radius: 2px;
  color: #f5f2ea;
  background:
    linear-gradient(180deg, rgba(10, 9, 8, .06) 0%, rgba(10, 9, 8, .42) 46%, rgba(10, 9, 8, .82) 100%),
    url("/img/ultron.jpg") 62% 18% / cover no-repeat;
  overflow: hidden;
}
.brand svg {
  width: 30px; height: 30px; flex: none; padding: 3px; border-radius: 2px;
  background: rgba(0, 0, 0, .38);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4);
  backdrop-filter: blur(3px);
}
.brand.neo {
  background:
    linear-gradient(180deg, rgba(10, 9, 8, .06) 0%, rgba(10, 9, 8, .42) 46%, rgba(10, 9, 8, .82) 100%),
    url("/img/neo.jpg") 50% 22% / cover no-repeat;
}
.brand.karmen {
  background:
    linear-gradient(180deg, rgba(10, 9, 8, .06) 0%, rgba(10, 9, 8, .42) 46%, rgba(10, 9, 8, .82) 100%),
    url("/img/karmen.jpg") 50% 42% / cover no-repeat;
}
h1 { margin: 0; font: 600 26px/1 Georgia, "Times New Roman", serif; letter-spacing: .5px; color: #f5f2ea; }
.sub { color: rgba(245, 242, 234, .74); font-size: 10px; margin-top: 4px; letter-spacing: .18em; text-transform: uppercase; }
#statusbox { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; min-height: 22px; }
.dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none; }
.dotc.eng { background: var(--muted); animation: pulse 1.1s ease-in-out infinite; }
.dotc.over { background: var(--line-2); }
@keyframes pulse { 50% { opacity: .3; } }

.trashbox {
  font: italic 16px/1.5 Georgia, "Times New Roman", serif;
  color: var(--ink-2);
  padding: 1px 0 1px 14px;
  border-left: 2px solid var(--ink);
  animation: fadein .25s ease;
}
@keyframes fadein { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

.rookmeme {
  position: fixed;
  top: 16%;
  left: 50%;
  transform: translateX(-50%) scale(.8);
  background: var(--ink);
  color: var(--paper);
  font: 700 38px/1 Georgia, serif;
  padding: 18px 34px;
  border-radius: 2px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, .35);
  z-index: 2000;
  pointer-events: none;
  animation: rookpop 1.6s ease forwards;
  letter-spacing: 3px;
  white-space: nowrap;
}
@keyframes rookpop {
  0%   { opacity: 0; transform: translateX(-50%) scale(.5) rotate(-6deg); }
  20%  { opacity: 1; transform: translateX(-50%) scale(1.12) rotate(2deg); }
  70%  { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
  100% { opacity: 0; transform: translateX(-50%) scale(1.16); }
}

/* ---------- настройки ---------- */
.settings { display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
label.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 9px 0;
  font-size: 10.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
label.row select { width: 164px; text-transform: none; letter-spacing: 0; text-align: right; }
.toggles { display: flex; flex-direction: column; gap: 10px; }
label.check { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink); }
input[type="checkbox"] { accent-color: var(--ink); width: 15px; height: 15px; }

select, button { font: inherit; color: var(--ink); }
select {
  cursor: pointer;
  padding: 4px 2px;
  font-size: 13.5px;
  border: 0;
  border-bottom: 1px solid transparent;
  border-radius: 0;
  background: transparent;
  transition: border-color .16s;
}
select:hover { border-bottom-color: var(--line-2); }
select:focus-visible, button:focus-visible { outline: 2px solid rgba(25, 24, 22, .45); outline-offset: 2px; }
button {
  cursor: pointer;
  padding: 11px 14px;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: .06em;
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 2px;
  transition: background .16s, border-color .16s, color .16s;
}
button:hover:not(:disabled) { background: rgba(25, 24, 22, .06); border-color: var(--ink); }
button:disabled { opacity: .35; cursor: default; }
button.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: #f7f4ed;
  font-weight: 600;
}
button.primary:hover:not(:disabled) { background: #2f2c27; border-color: #2f2c27; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns .wide { grid-column: 1 / -1; }

/* ---------- ходы ---------- */
.moves-wrap { display: flex; flex-direction: column; }
.moves-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 6px;
  border-bottom: 2px solid var(--ink);
}
#moves {
  max-height: 224px;
  min-height: 68px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 34px 1fr 1fr;
  align-content: start;
  font: 13px/1.6 ui-monospace, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  padding-right: 4px;
}
#moves span { padding: 2px 6px; }
#moves .n { color: var(--muted); padding-right: 0; }
#moves .cur { font-weight: 700; background: var(--paper-2); }
#moves .empty { grid-column: 1 / -1; color: var(--muted); font-family: inherit; font-size: 13px; font-style: italic; }
#moves::-webkit-scrollbar { width: 7px; }
#moves::-webkit-scrollbar-thumb { background: rgba(25, 24, 22, .22); border-radius: 8px; }
#moves::-webkit-scrollbar-track { background: transparent; }

/* ---------- архив и разбор ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 26px;
  background: rgba(25, 24, 22, .42);
  backdrop-filter: blur(3px);
}
.overlay[hidden] { display: none; }
.sheet {
  width: min(880px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--paper);
  border: 1px solid var(--ink);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .32);
  padding: 26px 32px 34px;
}
.sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding-bottom: 12px;
  border-bottom: 3px solid var(--ink);
}
.sheet h2 { margin: 4px 0 0; font: 600 30px/1.1 Georgia, "Times New Roman", serif; }
.kicker2 { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.x {
  background: none; border: 0; padding: 0 2px;
  font: 400 30px/1 Georgia, serif; color: var(--ink); cursor: pointer;
}
.x:hover { background: none; }
.grow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  gap: 18px;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.grow .who { font-weight: 600; }
.grow .who i { font-style: normal; color: var(--muted); font-weight: 400; }
.grow .when { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); }
.grow .out { font-size: 13px; letter-spacing: .02em; }
.grow .out b { font-weight: 700; }
.btn-link {
  background: none; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0;
  padding: 2px 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
}
.btn-link:hover { background: none; }
.note { color: var(--muted); font-size: 13px; font-style: italic; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); font-style: italic; }
.ana-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
  padding: 18px 0 14px;
  border-bottom: 1px solid var(--line-2);
}
.acc-num { font: 600 48px/1 Georgia, serif; text-align: right; }
.acc-num span { display: block; font: 10px/1.4 "Segoe UI", sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--ink); }
.stat { padding: 14px 0 12px; }
.stat b { display: block; font: 600 26px/1 Georgia, serif; }
.stat span { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.graph { width: 100%; height: 110px; margin: 16px 0 4px; display: block; }
.ana-head2 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.ana-head2 span { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.ana-list { max-height: 290px; overflow-y: auto; }
.ana-row {
  display: grid;
  grid-template-columns: 46px 64px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font: 13px/1.5 ui-monospace, Consolas, monospace;
}
.ana-row .num { color: var(--muted); }
.ana-row .san { font-weight: 600; }
.ana-row .alt { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ana-row .loss { color: var(--muted); font-size: 12px; }
.tag {
  font: 600 9.5px/1.7 "Segoe UI", sans-serif;
  letter-spacing: .12em;
  text-transform: uppercase;
  border: 1px solid var(--line-2);
  padding: 0 6px;
  border-radius: 2px;
  white-space: nowrap;
}
.tag.good { border-color: transparent; color: var(--muted); padding: 0; }
.tag.best { border-color: transparent; padding: 0; }
.tag.inaccuracy { border-style: dashed; }
.tag.mistake { border-color: var(--ink); }
.tag.blunder { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ana-row .right { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.elo-line { margin-top: 14px; font-size: 15px; color: var(--ink-2); }
.elo-line b { font: 600 20px/1 Georgia, "Times New Roman", serif; color: var(--ink); }
.elo-line span { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); font-style: italic; }
.ana-actions { display: flex; gap: 22px; align-items: center; justify-content: flex-end; margin-top: 24px; }
.ana-actions .note { margin-right: auto; }

@media (max-width: 1120px) {
  :root { --bs: min(calc(100vw - 80px), 560px); }
  .mast-inner { padding: 34px 22px 22px; flex-direction: column; align-items: flex-start; gap: 14px; }
  .mast-meta { text-align: left; }
  .app { padding: 24px 20px 56px; gap: 30px; }
  .panel { width: min(100%, 560px); }
  .evalbar { left: -30px; width: 18px; }
  .sheet { padding: 20px; }
  .grow { grid-template-columns: minmax(0, 1fr) auto; }
  .grow .when { grid-column: 1 / -1; grid-row: 2; }
  .grow .out { grid-column: 1; grid-row: 3; }
  .grow .btn-link { grid-column: 2; grid-row: 3; justify-self: end; }
}

<script>

      <path class="m bt" d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/>

      <path class="dt mt" d="M17.5 26h10M15 30h15m-7.5-14.5v5M20 18h5"/>`,
  q: `<path class="m" d="M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM16 8.5a2 2 0 1 1-4 0 2 2 0 1 1 4 0zM33 9a2 2 0 1 1-4 0 2 2 0 1 1 4 0z"/>
      <path class="m bt" d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14V25L7 14l2 12z"/>

(function () {
  "use strict";
  var FILES = "abcdefgh";
  var START = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  var VAL = { p: 1, n: 3, b: 3, r: 5, q: 9 };
  var ORDER = ["q", "r", "b", "n", "p"];

  var me = "w", flipped = false;
  var state = null, states = [];
  var sel = null, hint = null, hintTimer = null;
  var busy = false, engineThinking = false, gameId = 0;
  var opp = "grek", gameKey = 0, savedGame = -1;
  var evalCp = 0;
  var clocks = { w: 0, b: 0 }, inc = 0, clockOn = false, lastTick = null, timeout = null;
  var resultDismissed = false, resultSaid = -1;
  var drag = null, promoPending = null;
  var soundOn = true, voiceOn = true;
  var hosted = false;
  var cfg = fetch("/config").then(function (r) { return r.json(); })
    .then(function (c) { hosted = !!c.hosted; }).catch(function () {});

  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { localStorage.setItem("chess." + k, v); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem("chess." + k); return v === null ? d : v; } catch (e) { return d; } }

  /* ---------- звук ---------- */
  var actx = null;
  function beep(freq, dur, vol) {
    if (!soundOn) { return; }
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = freq; g.gain.value = vol || 0.09;
      o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------- озвучка grek'а (голос Альтрона) ---------- */
  /* Один <audio> на всё: два файла физически не могут играть одновременно.
     Реплика с более высоким приоритетом перебивает текущую (но не раньше 1.2 с),
     равная или низкая — отбрасывается, чтобы не копился хвост из старых фраз.
     pri: 4 — финал партии, 3 — рокировка/новая игра, 2 — шах/взятие, 1 — трэш-ток.
     force — играть обязательно: финальная фраза не отменяется ничем. */
  var voicePlaying = false;
  var voicePri = 0;
  var voiceStart = 0;
  var voiceEl = new Audio();
  voiceEl.preload = "auto";
  voiceEl.volume = 0.55;
  voiceEl.onended = voiceEl.onerror = function () { voicePlaying = false; voicePri = 0; };

  function voice(file, pri, force) {
    if (!voiceOn || !file) { return; }
    pri = pri || 1;
    if (voicePlaying) {
      if (!force && (pri <= voicePri || Date.now() - voiceStart < 1200)) { return; }
      stopVoice();
    }
    voicePlaying = true;
    voicePri = pri;
    voiceStart = Date.now();
    voiceEl.src = "/voice/" + file;
    voiceEl.play().catch(function () { voicePlaying = false; voicePri = 0; });
  }
  function stopVoice() {
    voicePlaying = false;
    voicePri = 0;
    try { voiceEl.pause(); } catch (e) {}
  }
  /* ротация по кругу, чтобы звучали все записанные варианты, а не 1-2 случайных */
  function nextLine(prefix, n, key) {
    var i = Number(load(key, "0")) % n;
    store(key, String((i + 1) % n));
    return prefix + i + ".wav";
  }
  function sayRook() {
    if (!voiceOn) { return; }
    voice("rook.wav", 3);
  }
  function reactCheck() { return nextLine("check", 3, "chkIdx"); }
  function reactCapture() { return nextLine("capture", 4, "capIdx"); }

  /* ---------- API ---------- */
  async function api(moves, o) {
    o = o || {};
    var url = "/api?moves=" + moves.join(",") + "&ms=" + Math.round(o.ms || 1000) +
      "&engine=" + (o.engine ? 1 : 0) + "&hint=" + (o.hint ? 1 : 0) + "&opp=" + opp;
    var r = await fetch(url, { cache: "no-store" });
    var data = await r.json();
    if (data.error) { throw new Error(data.error); }
    return data;
  }

  /* ---------- доска ---------- */
  function parseBoard(p) {
    return p.split("/").map(function (row) {
      var out = [];
      for (var i = 0; i < row.length; i++) {
        var ch = row[i];
        if (ch >= "1" && ch <= "8") { for (var k = 0; k < Number(ch); k++) { out.push(""); } } else { out.push(ch); }
      }
      return out;
    });
  }
  function pieceAtName(grid, name) { return grid[8 - Number(name[1])][name.charCodeAt(0) - 97]; }
  function isWhitePiece(p) { return p === p.toUpperCase(); }
  function pieceSVG(ch, extra) {
    return '<svg class="piece ' + (isWhitePiece(ch) ? "pw" : "pb") + (extra ? " " + extra : "") +
      '" viewBox="0 0 45 45">' + PIECES_SVG[ch.toLowerCase()] + "</svg>";
  }
  function targetsOf(from) {
    var t = {};
    if (!state) { return t; }
    state.legal.forEach(function (m) { if (m.slice(0, 2) === from) { t[m.slice(2, 4)] = true; } });
    return t;
  }
  function gameOver() { return timeout !== null || (state && state.status !== "ongoing"); }
  function canMove() { return state && !busy && !gameOver() && state.turn === me; }
  function sqXY(name) {
    var f = name.charCodeAt(0) - 97, rk = Number(name[1]);
    return { x: flipped ? 7 - f : f, y: flipped ? rk - 1 : 8 - rk };
  }

  function render() {
    if (!state) { return; }
    var grid = parseBoard(state.board);
    var last = state.moves.length ? state.moves[state.moves.length - 1] : null;
    var targets = sel ? targetsOf(sel) : {};
    var kingSq = null;
    if (state.check) {
      var king = state.turn === "w" ? "K" : "k";
      for (var rr = 0; rr < 8; rr++) for (var ff = 0; ff < 8; ff++) { if (grid[rr][ff] === king) { kingSq = FILES[ff] + (8 - rr); } }
    }
    var mineOK = canMove();
    var html = "";
    for (var i = 0; i < 8; i++) {
      for (var j = 0; j < 8; j++) {
        var r = flipped ? 7 - i : i, f = flipped ? 7 - j : j;
        var name = FILES[f] + (8 - r);
        var p = grid[r][f];
        var cls = "sq " + (((r + f) % 2 === 0) ? "l" : "d");
        if (last && (name === last.slice(0, 2) || name === last.slice(2, 4))) { cls += " last"; }
        if (sel === name) { cls += " sel"; }
        if (kingSq === name) { cls += " chk"; }
        if (hint && (name === hint.slice(0, 2) || name === hint.slice(2, 4))) { cls += " hint"; }
        if (targets[name] && p) { cls += " cap"; }
        if (mineOK && p && (me === "w") === isWhitePiece(p)) { cls += " mine"; }
        html += '<div class="' + cls + '" data-sq="' + name + '">';
        if (targets[name]) { html += '<span class="mdot"></span>'; }
        if (p) { html += pieceSVG(p); }
        html += "</div>";
      }
    }
    $("board").innerHTML = html;
    renderCoords();
    renderArrows();
    renderCards(grid);
    renderMoves();
    renderStatus();
    renderEval();
    renderResult();
    $("hintBtn").disabled = !canMove();
    $("undo").disabled = busy || !undoPlan();
    $("evalbar").className = "evalbar" + (flipped ? " flip" : "");
  }

  function renderCoords() {
    var rk = "", fl = "";
    for (var i = 0; i < 8; i++) {
      rk += "<span>" + (flipped ? i + 1 : 8 - i) + "</span>";
      fl += "<span>" + FILES[flipped ? 7 - i : i] + "</span>";
    }
    $("ranks").innerHTML = rk;
    $("files").innerHTML = fl;
  }

  function renderArrows() {
    var svg = $("arrows");
    if (!hint) { svg.innerHTML = ""; return; }
    var a = sqXY(hint.slice(0, 2)), b = sqXY(hint.slice(2, 4));
    var x1 = a.x + .5, y1 = a.y + .5, x2 = b.x + .5, y2 = b.y + .5;
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len, head = .38;
    var ex = x2 - ux * head, ey = y2 - uy * head;
    var px = -uy, py = ux;
    svg.innerHTML =
      '<g opacity=".85" fill="#191816" stroke="none">' +
      '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + ex + '" y2="' + ey + '" stroke="#191816" stroke-width=".17" stroke-linecap="round"/>' +
      '<polygon points="' + x2 + "," + y2 + " " + (ex + px * .24) + "," + (ey + py * .24) + " " + (ex - px * .24) + "," + (ey - py * .24) + '"/></g>';
  }

  function fmt(ms) {
    if (ms < 0) { ms = 0; }
    var s = ms / 1000;
    if (s < 10) { return "0:0" + s.toFixed(1); }
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function countsOf(grid) {
    var c = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
    grid.forEach(function (row) {
      row.forEach(function (p) {
        if (!p || p.toLowerCase() === "k") { return; }
        c[isWhitePiece(p) ? "w" : "b"][p.toLowerCase()]++;
      });
    });
    return c;
  }
  function material(c) { var s = 0; for (var k in VAL) { s += VAL[k] * c[k]; } return s; }
  function renderCards(grid) {
    var c = countsOf(grid);
    var diff = material(c.w) - material(c.b);
    var bottom = flipped ? "b" : "w", top = flipped ? "w" : "b";
    $("topCard").innerHTML = cardHTML(top, c, diff);
    $("botCard").innerHTML = cardHTML(bottom, c, diff);
    renderClocks();
  }
  function cardHTML(color, c, diff) {
    var other = color === "w" ? "b" : "w";
    var isMe = color === me;
    var caps = "";
    ORDER.forEach(function (k) {
      var n = Math.max(0, START[k] - c[other][k]);
      if (n > 0) {
        var ch = other === "w" ? k.toUpperCase() : k;
        var g = "";
        for (var i = 0; i < n; i++) { g += pieceSVG(ch); }
        caps += '<span class="grp">' + g + "</span>";
      }
    });
    var ahead = color === "w" ? diff : -diff;
    if (ahead > 0) { caps += "<b>+" + ahead + "</b>"; }
    var thinking = (!isMe && engineThinking) ? '<span class="think">думает…</span>' : "";
    var av = isMe ? pieceSVG(me === "w" ? "K" : "k") : '<img src="/img/' + (opp === "neo" ? "neo" : opp === "karmen" ? "karmen" : "eye") + '.jpg" alt="">';
    return '<div class="avatar">' + av + "</div>" +
      '<div class="pinfo"><div class="pname">' + (isMe ? "Вы" : oppName()) + thinking + '</div><div class="caps">' + caps + "</div></div>" +
      '<div class="clock' + (clockOn ? "" : " hidden") + '" data-clock="' + color + '"></div>';
  }
  function renderClocks() {
    var els = document.querySelectorAll("[data-clock]");
    for (var i = 0; i < els.length; i++) {
      var col = els[i].getAttribute("data-clock");
      els[i].textContent = fmt(clocks[col]);
      var active = clockOn && state && !gameOver() && state.moves.length >= 1 && state.turn === col;
      els[i].className = "clock" + (clockOn ? "" : " hidden") + (active ? " active" : "") + (clocks[col] < 10000 ? " low" : "");
    }
  }
  function tick() {
    var now = performance.now();
    var dt = lastTick === null ? 0 : now - lastTick;
    lastTick = now;
    if (clockOn && state && !gameOver() && state.moves.length >= 1) {
      clocks[state.turn] -= dt;
      if (clocks[state.turn] <= 0) {
        clocks[state.turn] = 0;
        timeout = state.turn;
        engineThinking = false;
        beep(300, .3, .1);
        if (opp === "grek") { voice(timeout === me ? "timeout.wav" : "playerwin.wav", 4, true); }
        render();
        return;
      }
    }
    renderClocks();
  }

  /* ---------- SAN ---------- */
  function san(uci, before, after) {
    var grid = parseBoard(before.board);
    var from = uci.slice(0, 2), to = uci.slice(2, 4), promo = uci[4];
    var piece = pieceAtName(grid, from), pt = piece.toLowerCase();
    var capture = pieceAtName(grid, to) !== "" || (pt === "p" && from[0] !== to[0]);
    var s;
    if (pt === "k" && Math.abs(from.charCodeAt(0) - to.charCodeAt(0)) === 2) {
      s = to[0] === "g" ? "O-O" : "O-O-O";
    } else if (pt === "p") {
      s = capture ? from[0] + "x" + to : to;
      if (promo) { s += "=" + promo.toUpperCase(); }
    } else {
      s = pt.toUpperCase();
      var others = before.legal.filter(function (m) {
        return m.slice(0, 2) !== from && m.slice(2, 4) === to && pieceAtName(grid, m.slice(0, 2)) === piece;

  /* ---------- ходы ---------- */

  function tryMove(from, to) {

    var p = pieceAtName(grid, name);

  });

  function startDrag(e, name, p) {

  function moveGhost(e) {

    var d = drag; drag = null;
    d.ghost.remove();
    if (!d.moved) { return; }
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var sqEl = el && el.closest ? el.closest(".sq") : null;
    var to = sqEl ? sqEl.getAttribute("data-sq") : null;
    if (to && to !== d.from && targetsOf(d.from)[to]) { sel = null; tryMove(d.from, to); render(); }
    else { render(); }
  }

  $("promo").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !promoPending) { return; }
    var uci = promoPending.from + promoPending.to + b.getAttribute("data-p");
    closePromo();
    playerMove(uci);
  });
  $("promoModal").addEventListener("click", function (e) {
    if (e.target === $("promoModal")) { closePromo(); render(); }
  });

  /* ---------- подсказка/отмена/новая ---------- */
  function clearHint() { hint = null; if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; } }
  async function getHint() {
    if (!canMove()) { return; }
    var id = gameId;
    busy = true; render();
    try {
      var s = await api(state.moves, { hint: true, ms: 1500 });
      if (id !== gameId) { return; }
      if (s.hint) {
        hint = s.hint;
        if (hintTimer) { clearTimeout(hintTimer); }
        hintTimer = setTimeout(function () { hint = null; render(); }, 6000);
      }
      if (s.eval !== null && s.eval !== undefined) { setEval(s.eval); }
    } catch (e) { fail(e); return; }
    busy = false; render();
  }
  function undoPlan() {
    if (!state || states.length < 2) { return null; }
    var k = state.turn === me ? 2 : 1;
    var keep = state.moves.length - k;
    if (keep < (me === "b" ? 1 : 0)) { return null; }
    return k;
  }
  function undo() {
    if (busy) { return; }
    var k = undoPlan();
    if (!k) { return; }
    gameId++;
    savedGame = -1;
    gameKey = Date.now();
    states = states.slice(0, states.length - k);
    state = states[states.length - 1];
    sel = null; clearHint(); timeout = null; resultDismissed = false; engineThinking = false;
    render();
  }

  function parseTC(v) {
    if (v === "0") { return { base: 0, inc: 0 }; }
    var p = v.split("+");
    return { base: Number(p[0]) * 60000, inc: Number(p[1]) };
  }

  async function newGame() {
    var id = ++gameId;
    opp = $("opp").value;
    if (opp !== "neo" && opp !== "karmen") { opp = "grek"; }
    gameKey = Date.now();
    savedGame = -1;
    document.title = "Шахматы против " + oppName();
    $("brandCard").className = "brand" + (opp === "grek" ? "" : " " + opp);
    $("brandName").textContent = oppName();
    $("brandSub").textContent = opp === "neo" ? "младшая сеть · ≈ 1300"
      : opp === "karmen" ? "атакующая сеть · ≈ 1700"
      : "шахматный движок · ≈ 2300";
    var cv = $("color").value;
    me = cv === "r" ? (Math.random() < 0.5 ? "w" : "b") : cv;
    flipped = me === "b";
    var tc = parseTC($("tc").value);
    clockOn = tc.base > 0; inc = tc.inc;
    clocks = { w: tc.base, b: tc.base };
    lastTick = null; timeout = null; resultDismissed = false;
    sel = null; clearHint(); closePromo();
    evalCp = 0; engineThinking = false;
    busy = true;
    try {
      var s = await api([], {});
      if (id !== gameId) { return; }
      states = [s]; state = s;
      render();
      if (opp === "grek") { voice("newgame.wav", 4, true); }
      if (me === "b") { await engineTurn(id); }
    } catch (e) { fail(e); return; }
    if (id !== gameId) { return; }
    busy = false; engineThinking = false;
    render();
  }

  function fail(e) {
    busy = false; engineThinking = false;
    $("status").textContent = "Нет связи с движком: " + e.message;
  }

  /* ---------- настройки/старт ---------- */
  $("new").addEventListener("click", newGame);
  $("archiveBtn").addEventListener("click", openArchive);
  $("opp").addEventListener("change", function () { store("opp", $("opp").value); newGame(); });
  $("resNew").addEventListener("click", newGame);
  $("resClose").addEventListener("click", function () { resultDismissed = true; render(); });
  $("undo").addEventListener("click", undo);
  $("hintBtn").addEventListener("click", getHint);
  $("flip").addEventListener("click", function () { flipped = !flipped; render(); });
  $("color").addEventListener("change", newGame);
  $("tc").addEventListener("change", function () { store("tc", $("tc").value); newGame(); });
  $("ems").addEventListener("change", function () { store("ems", $("ems").value); });
  $("theme").addEventListener("change", function () {
    document.documentElement.setAttribute("data-theme", $("theme").value);
    store("theme3", $("theme").value);
  });
  $("sound").addEventListener("change", function () { soundOn = $("sound").checked; store("sound", soundOn ? "1" : "0"); });
  $("voice").addEventListener("change", function () {
    voiceOn = $("voice").checked;
    store("voice", voiceOn ? "1" : "0");
    if (!voiceOn) { stopVoice(); }
  });

  $("theme").value = load("theme3", "marble");
  if (!$("theme").value) { $("theme").value = "marble"; }
  document.documentElement.setAttribute("data-theme", $("theme").value);
  $("tc").value = load("tc", "0");
  $("opp").value = load("opp", "grek");
  $("ems").value = load("ems", "1000");
  soundOn = load("sound", "1") === "1";
  $("sound").checked = soundOn;
  voiceOn = load("voice", "1") === "1";
  $("voice").checked = voiceOn;

  $("brandIcon").innerHTML = pieceSVG("N");
  var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var now = new Date();
  $("mastMeta").innerHTML = "<b>" + now.getDate() + " " + MONTHS[now.getMonth()] + " " + now.getFullYear() + "</b>" +
    "<span>движки grek, karmen и neo · без внешних сервисов</span>";
  setInterval(tick, 100);
  newGame();
})();
</script>
</body>
</html>
